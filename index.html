<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="https://res.cloudinary.com/uorctww6/image/upload/v1789377037/arrowline/general/favicon.png" />
    <!-- SEO Meta Elements -->
    <title>Arrowline Logistics | Mundra Port Logistics &amp; Pan-India Transportation Services</title>
    <meta name="description" content="Arrowline Logistics is an authorized multimodal logistics and transportation company headquartered at Mundra Port, Gujarat. Operating pan-India container haulage, FTL road freight, rail corridors, ODC heavy haulage, and warehousing." />
    <meta name="author" content="Arrowline Logistics" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arrowline Logistics" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Arrowline Logistics | Mundra Port Logistics &amp; Pan-India Transportation Services" />
    <meta property="og:description" content="Dedicated container haulage, FTL road transport, and rail rakes connecting Mundra Port to Delhi-NCR, Jaipur, Ahmedabad, Mumbai, Pune, Indore, Bengaluru, and pan-India." />
    <meta property="og:image" content="https://res.cloudinary.com/uorctww6/image/upload/v1789377038/arrowline/general/hero-logistics.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Arrowline Logistics — premium multimodal freight fleet" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arrowline Logistics | Mundra Port Logistics &amp; Pan-India Transportation Services" />
    <meta name="twitter:description" content="Dedicated container haulage, FTL road transport, and rail rakes connecting Mundra Port to Delhi-NCR, Jaipur, Ahmedabad, Mumbai, Pune, Indore, Bengaluru, and pan-India." />
    <meta name="twitter:image" content="https://res.cloudinary.com/uorctww6/image/upload/v1789377038/arrowline/general/hero-logistics.jpg" />

    <!-- Preconnect + fonts actually used by the design system (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Canonical (kept in sync dynamically by the React SEO manager) -->
    <link rel="canonical" href="https://arrowlinelogistics.in" />

    <!-- Preconnect for Cloudinary (LCP image preloaded per-route by React) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Instant boot splash (critical CSS, painted before React mounts) -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #03212D;
        background-image: radial-gradient(ellipse 90% 70% at 50% 42%, #06303D 0%, #03212D 55%, #021722 100%);
        pointer-events: none;
      }
      #boot-splash .bs-inner {
        text-align: center;
        opacity: 0;
        transform: scale(0.94);
        animation: bs-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      #boot-splash .bs-arrow {
        animation: bs-glow 2.2s ease-in-out 0.5s infinite;
      }
      #boot-splash .bs-logo {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #boot-splash .bs-bar {
        width: 160px;
        height: 2px;
        margin: 28px auto 0;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      #boot-splash .bs-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 8%;
        border-radius: 999px;
        background: linear-gradient(90deg, #FF6B1A, #FF8C2A);
        box-shadow: 0 0 12px rgba(255, 107, 26, 0.45);
        animation: bs-fill 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }
      @keyframes bs-in { to { opacity: 1; transform: scale(1); } }
      @keyframes bs-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 122, 0, 0)); }
        50% { filter: drop-shadow(0 0 16px rgba(255, 122, 0, 0.55)); }
      }
      @keyframes bs-fill { to { width: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-inner">
        <div class="bs-logo">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-weight:900;letter-spacing:-0.02em;color:#fff;font-size:36px;line-height:1">ARROWLINE</span>
            <svg class="bs-arrow" width="48" height="40" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
              <path d="M 2 4 L 26 4 L 38 16 L 26 28 L 2 28 L 14 16 Z" fill="#FF7A00" />
            </svg>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:12px">
            <div style="height:1.5px;width:16px;background:rgba(255,255,255,0.6);border-radius:2px"></div>
            <span style="font-weight:700;letter-spacing:0.35em;color:#fff;font-size:12px;line-height:1">LOGISTICS</span>
            <div style="height:1.5px;width:16px;background:rgba(255,255,255,0.6);border-radius:2px"></div>
          </div>
        </div>
        <div class="bs-bar"></div>
      </div>
    </div>
    <noscript><style>#boot-splash{display:none}</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
